[project]
name = "ha-solis"
version = "0.1.0"
description = "SolisCloud API client and Home Assistant integration"
authors = [
    {name = "dalectric"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
]

[project.scripts]
ha-solis = "soliscloud_api.__main__:main"
forecast-solar = "forecast_solar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soliscloud_api", "src/forecast_solar"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]
ha = [
    "homeassistant>=2026.2.3",
]
test = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "pytest-recording",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests hit the real API; opt in with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: hits the real SolisCloud API; skipped unless .env is present (run with -m live)",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["soliscloud_api", "forecast_solar"]
